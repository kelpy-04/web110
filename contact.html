<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet">
    <title>Contact Sheet</title>
    <link rel="stylesheet" href='stylessheet.css'>
</head>
<body>
    <div class = "container">
        <header>
            <img src="logo-1.jpg" alt="Johnson County College">
            <h2>Contact Us</h2>
            <p>We would love to here from you! Please fill out the form below.</p>
        </header>
    
        <main>
            <form method= "a secure method of transferring information" action = "https://webdevbasics.net/scripts/demo.php">
                <div class="form-group">
                    <label for ='firstName'>First Name</label>
                    <input type ='text' id ='firstName' name='firstName' maxlength="30" required>
                </div>

                <div class="form-group">
                    <label for ='lastName'>Last Name</label>
                    <input type ='text' id ='lastName' name='lastName' maxlength="30" required>
                </div>

                <div class="form-group">
                    <label for ='email'>Email</label>
                    <input type ='email' id ='email' name='email' maxlength="30" required>
                </div>

                <div class="form-group">
                    <label for ='phone'>Phone Number</label>
                    <input type ='tel' id ='phone' name='phone' maxlength="30" placeholder="123-456-7890" required>
                </div>

                <div class="form-group">
                    <label>How would you perfer we contact you?</label>

                    <div class="contact-options">
                        <div class ="radio-option">
                            <input type="radio" id="contactEmail" name="contactPreference" value="Email" required>
                            <label  for="contactEmail">Email</label>
                        </div>

                        <div class ="radio-option">
                            <input type="radio" id="contactPhone" name="contactPreference" value="Phone" required>
                            <label  for="contactPhone">Phone</label>
                        </div>

                        <div class ="radio-option">
                            <input type="radio" id="contactText" name="contactPreference" value="Text" required>
                            <label  for="contactText">Text</label>
                        </div>

                        <div class ="radio-option">
                            <input type="radio" id="contactNone" name="contactPreference" value="No Preference" required>
                            <label  for="contactNone">None</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy;Nathan Schembs 2026. All rights reserved</p>
        </footer>
    </div>
</body>
</html>
